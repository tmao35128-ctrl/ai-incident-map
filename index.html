<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI事件マップ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 地球儀を描く場所 -->
  <div id="globe"></div>

  <!-- 左上：タイトルと凡例 -->
  <header class="hud">
    <h1>AI事件マップ</h1>
    <p class="sub">AIが関わったサイバー事件（公表された情報のみ）</p>
    <ul class="legend">
      <li><span class="dot dot-ai"></span>AIが自分で起こした</li>
      <li><span class="dot dot-human"></span>人間がAIを悪用した</li>
    </ul>
  </header>

  <!-- 右：事件の一覧と詳細 -->
  <aside class="panel">
    <div id="detail" class="detail" hidden></div>
    <p id="count" class="count"></p>
    <ol id="list" class="list"></ol>
  </aside>

  <!-- 下：期間を選ぶバー（年はドロップダウン、月はボタン） -->
  <footer class="period">
    <span id="yearLabel" class="period-label">年</span>
    <!-- 自前のドロップダウン（ブラウザ標準の select は開いた部分の見た目を変えられないため） -->
    <div class="dropdown">
      <button id="yearButton" class="dropdown-button" type="button"
              aria-haspopup="listbox" aria-expanded="false" aria-labelledby="yearLabel yearButton">
        <span id="yearValue"></span>
        <svg class="chevron" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <ul id="yearList" class="dropdown-list" role="listbox" aria-labelledby="yearLabel" tabindex="-1" hidden></ul>
    </div>
    <div id="months" class="months" role="group" aria-label="月"></div>
  </footer>

  <script src="https://unpkg.com/globe.gl@2.46.2/dist/globe.gl.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
